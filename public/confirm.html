<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to ChooseWow!</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a202c;
            padding: 20px;
        }
        
        .confirmation-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 48px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        
        .celebration-emoji {
            font-size: 72px;
            margin-bottom: 24px;
            animation: bounce 1s ease-in-out;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            font-size: 18px;
            color: #64748b;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        
        .info-text {
            font-size: 16px;
            color: #475569;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        
        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 14px 32px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s ease;
        }
        
        .cta-button:hover {
            transform: scale(1.05);
        }
        
        @media (max-width: 480px) {
            .confirmation-container {
                padding: 32px 24px;
            }
            
            h1 {
                font-size: 30px;
            }
            
            .subtitle {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="confirmation-container">
        <div class="celebration-emoji">🌟</div>
        
        <h1>Welcome to ChooseWow!</h1>
        
        <div class="subtitle">
            Your journey to a more positive mindset starts now!
        </div>
        
        <div class="info-text">
            Check your inbox - we just sent you a welcome email with your free PDF guide: "5 Science-Based Strategies to Boost Your Positive Mindset."
        </div>
        
        <a href="https://choosewow.com" class="cta-button">Start Exploring</a>
    </div>
</body>
</html>
