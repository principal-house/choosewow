<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirming Subscription - ChooseWow</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .processing-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 48px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const brand = urlParams.get('brand') || 'choosewow';
            
            if (token) {
                window.location.replace(`https://mail.principal.house/api/confirm.php?token=${token}&brand=${brand}`);
            } else {
                document.body.innerHTML = `
                    <div class="processing-container">
                        <h1 style="color: #dc2626;">Invalid Confirmation Link</h1>
                        <p style="color: #6b7280; line-height: 1.6; margin: 16px 0;">
                            This confirmation link appears to be invalid or expired.
                        </p>
                        <a href="https://choosewow.com" style="color: #667eea;">Return to Homepage</a>
                    </div>
                `;
            }
        };
    </script>
</head>
<body>
    <div class="processing-container">
        <div class="spinner"></div>
        <h1>Confirming Your Subscription</h1>
        <p style="color: #6b7280;">Please wait while we confirm your email...</p>
    </div>
</body>
</html>
